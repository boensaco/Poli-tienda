<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index</title>
    <link rel="stylesheet" href="css/estilos.css">

</head>

<body>
    <header class="cabeza">
        <div class="division">
            <img src="assiets/DJ_13492.png" alt="Logo" class="Logo">
            <h1><strong>Bad-B</strong></h1>
            <a href="login.html" class="usuario">Iniciar sesión</a>
        </div>
    </header>

    <div class="productos" id="contenedor-productos">

    </div>

    <div>
        <img src="assiets/shopping-cart_icon-icons.com_69303.svg" alt="carrito" class="carrito">
    </div>

    <footer class="final">
        <p>&copy; 2024 Poli-Tienda. Todos los derechos reservados.</p>
    </footer>

    <script>
        async function cargarProductos() {
        const contenedor = document.getElementById('contenedor-productos')

        try {
            const respuesta = await fetch('http://localhost:4000/api/productos')
            const json = await respuesta.json()
            const productos = json.data
            
            contenedor.innerHTML = ''

            if (productos.length === 0) {
                contenedor.innerHTML = '<p>No hay productos disponibles.</p>'
                return
            }

            productos.forEach(producto => {
                const card = document.createElement('div')
                card.classList.add('card-producto')

                card.innerHTML = `
                    <img 
                        src="${producto.imagen_url || 'assiets/xdjxr1-576x433.jpg'}" 
                        alt="${producto.nombre}"
                        class="pro1"
                        onerror="this.src='assiets/xdjxr1-576x433.jpg'"
                    >
                    <h2>${producto.nombre}</h2>
                    <p>${producto.descripcion || 'Sin descripción'}</p>
                    <p class="precio">$${Number(producto.precio).toLocaleString('es-CO')}</p>
                    <p class="stock">Stock: ${producto.stock}</p>
                    <div class="botones">
                        <button onclick="verDescripcion(${producto.id_producto})">Descripción</button>
                        <button onclick="agregarAlCarrito(${producto.id_producto})">Comprar</button>
                    </div>
                `
                contenedor.appendChild(card)
            })

        } catch (error) {
            console.error('Error al cargar productos:', error)
            contenedor.innerHTML = '<p>Error al cargar los productos. ¿Está el servidor corriendo?</p>'
        }
    }

    function verDescripcion(id) {
        console.log('Ver descripción del producto:', id)
    }

    function agregarAlCarrito(id) {
        console.log('Agregar al carrito:', id)
    }
    cargarProductos()
    </script>
</body>


</html>
